<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday Stepan! 🎉</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="confetti" id="confetti"></div>

  <main class="card">
    <h1 class="title">🎂 Happy Birthday, Stepan! 🎉</h1>
    <p class="subtitle">Wishing you an awesome day full of joy and cake!</p>

    <div class="cake-wrap" id="cakeWrap">
      <div class="cake">
        <div class="candle" data-lit="true">
          <div class="flame"></div>
        </div>
        <div class="frosting"></div>
        <div class="layer layer-top"></div>
        <div class="layer layer-bottom"></div>
      </div>
    </div>

    <button id="blowBtn" class="btn">🕯️ Blow out the candle</button>
    <p class="hint" id="hint">Click the button to make a wish!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
