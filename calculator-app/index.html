<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1e2f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .calculator {
    width: 320px;
    background: #2b2b3d;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }
  .display {
    background: #111119;
    color: #fff;
    border-radius: 10px;
    padding: 20px 16px;
    margin-bottom: 16px;
    text-align: right;
    font-size: 2.5rem;
    overflow-x: auto;
    white-space: nowrap;
    min-height: 60px;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    border: none;
    border-radius: 10px;
    padding: 18px 0;
    font-size: 1.2rem;
    cursor: pointer;
    background: #3d3d54;
    color: #fff;
    transition: filter 0.15s ease;
  }
  button:hover { filter: brightness(1.15); }
  button:active { filter: brightness(0.9); }
  button.operator { background: #ff9f43; }
  button.equals { background: #4cd964; grid-column: span 2; }
  button.clear { background: #ff5e57; }
  button.zero { grid-column: span 2; }
</style>
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="clear" id="clear">C</button>
      <button class="operator" data-op="/">÷</button>
      <button class="operator" data-op="*">×</button>
      <button class="operator" data-op="-">−</button>

      <button class="digit">7</button>
      <button class="digit">8</button>
      <button class="digit">9</button>
      <button class="operator" data-op="+">+</button>

      <button class="digit">4</button>
      <button class="digit">5</button>
      <button class="digit">6</button>
      <button class="equals" id="equals" style="grid-row: span 2;">=</button>

      <button class="digit">1</button>
      <button class="digit">2</button>
      <button class="digit">3</button>

      <button class="digit zero">0</button>
      <button id="decimal">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    let current = '0';
    let previous = null;
    let operator = null;
    let resetNext = false;

    function updateDisplay() {
      display.textContent = current;
    }

    function inputDigit(digit) {
      if (resetNext) {
        current = digit;
        resetNext = false;
      } else {
        current = current === '0' ? digit : current + digit;
      }
      updateDisplay();
    }

    function inputDecimal() {
      if (resetNext) {
        current = '0.';
        resetNext = false;
        updateDisplay();
        return;
      }
      if (!current.includes('.')) {
        current += '.';
        updateDisplay();
      }
    }

    function compute() {
      const a = parseFloat(previous);
      const b = parseFloat(current);
      if (isNaN(a) || isNaN(b)) return b;
      switch (operator) {
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        case '/': return b === 0 ? NaN : a / b;
        default: return b;
      }
    }

    function handleOperator(op) {
      if (operator && !resetNext) {
        current = String(compute());
      }
      previous = current;
      operator = op;
      resetNext = true;
      updateDisplay();
    }

    function handleEquals() {
      if (operator === null) return;
      current = String(compute());
      operator = null;
      previous = null;
      resetNext = true;
      updateDisplay();
    }

    function clearAll() {
      current = '0';
      previous = null;
      operator = null;
      resetNext = false;
      updateDisplay();
    }

    document.querySelectorAll('.digit').forEach((btn) => {
      btn.addEventListener('click', () => inputDigit(btn.textContent));
    });

    document.querySelectorAll('.operator').forEach((btn) => {
      btn.addEventListener('click', () => handleOperator(btn.dataset.op));
    });

    document.getElementById('decimal').addEventListener('click', inputDecimal);
    document.getElementById('equals').addEventListener('click', handleEquals);
    document.getElementById('clear').addEventListener('click', clearAll);
  </script>
</body>
</html>
