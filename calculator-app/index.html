<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nova Calculator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-glow"></div>
  <main class="calculator" id="calculator">
    <div class="display">
      <div class="history" id="history">&nbsp;</div>
      <div class="current" id="current">0</div>
    </div>

    <div class="keys">
      <button class="key op secondary" data-action="clear">AC</button>
      <button class="key op secondary" data-action="negate">+/-</button>
      <button class="key op secondary" data-action="percent">%</button>
      <button class="key op accent" data-op="÷">÷</button>

      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>
      <button class="key op accent" data-op="×">×</button>

      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>
      <button class="key op accent" data-op="−">−</button>

      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>
      <button class="key op accent" data-op="+">+</button>

      <button class="key wide" data-num="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key op accent equals" data-action="equals">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
