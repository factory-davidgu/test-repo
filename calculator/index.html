<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculator</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="calculator">
    <div class="display">
      <div class="display-expression" id="expression"></div>
      <div class="display-result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn function" data-action="clear">AC</button>
      <button class="btn function" data-action="negate">±</button>
      <button class="btn function" data-action="percent">%</button>
      <button class="btn operator" data-action="divide">÷</button>

      <button class="btn digit" data-digit="7">7</button>
      <button class="btn digit" data-digit="8">8</button>
      <button class="btn digit" data-digit="9">9</button>
      <button class="btn operator" data-action="multiply">×</button>

      <button class="btn digit" data-digit="4">4</button>
      <button class="btn digit" data-digit="5">5</button>
      <button class="btn digit" data-digit="6">6</button>
      <button class="btn operator" data-action="subtract">−</button>

      <button class="btn digit" data-digit="1">1</button>
      <button class="btn digit" data-digit="2">2</button>
      <button class="btn digit" data-digit="3">3</button>
      <button class="btn operator" data-action="add">+</button>

      <button class="btn digit zero" data-digit="0">0</button>
      <button class="btn digit" data-digit=".">.</button>
      <button class="btn operator equals" data-action="equals">=</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
