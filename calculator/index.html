<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .calculator {
    width: 320px;
    background: #202124;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
  }
  .display {
    color: #fff;
    text-align: right;
    font-size: 2.5rem;
    padding: 20px 10px;
    min-height: 60px;
    overflow-x: auto;
    word-wrap: break-word;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    padding: 20px 0;
    font-size: 1.2rem;
    border: none;
    border-radius: 10px;
    background: #3a3b3c;
    color: #fff;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: #4a4b4c; }
  button:active { transform: scale(0.97); }
  .operator { background: #ff9500; }
  .operator:hover { background: #ffab33; }
  .equals { background: #ff9500; grid-column: span 2; }
  .clear { background: #a5a5a5; color: #000; }
  .clear:hover { background: #bdbdbd; }
  .zero { grid-column: span 2; }
</style>
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="clear" onclick="clearAll()">AC</button>
      <button class="clear" onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="chooseOperator('%')">%</button>
      <button class="operator" onclick="chooseOperator('/')">÷</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="chooseOperator('*')">×</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="chooseOperator('-')">−</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>

      <button class="zero" onclick="appendNumber('0')">0</button>
      <button onclick="appendNumber('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentValue = '0';
    let previousValue = null;
    let operator = null;
    let shouldResetDisplay = false;

    const display = document.getElementById('display');

    function updateDisplay() {
      display.textContent = currentValue;
    }

    function appendNumber(num) {
      if (shouldResetDisplay) {
        currentValue = '0';
        shouldResetDisplay = false;
      }
      if (num === '.' && currentValue.includes('.')) return;
      if (currentValue === '0' && num !== '.') {
        currentValue = num;
      } else {
        currentValue += num;
      }
      updateDisplay();
    }

    function chooseOperator(op) {
      if (operator !== null && !shouldResetDisplay) {
        calculate();
      }
      previousValue = currentValue;
      operator = op;
      shouldResetDisplay = true;
    }

    function calculate() {
      if (operator === null || previousValue === null) return;
      const prev = parseFloat(previousValue);
      const curr = parseFloat(currentValue);
      let result;
      switch (operator) {
        case '+': result = prev + curr; break;
        case '-': result = prev - curr; break;
        case '*': result = prev * curr; break;
        case '/': result = curr === 0 ? NaN : prev / curr; break;
        case '%': result = prev % curr; break;
        default: return;
      }
      currentValue = Number.isNaN(result) ? 'Error' : String(parseFloat(result.toFixed(10)));
      operator = null;
      previousValue = null;
      shouldResetDisplay = true;
      updateDisplay();
    }

    function clearAll() {
      currentValue = '0';
      previousValue = null;
      operator = null;
      shouldResetDisplay = false;
      updateDisplay();
    }

    function deleteLast() {
      if (shouldResetDisplay) return;
      currentValue = currentValue.length > 1 ? currentValue.slice(0, -1) : '0';
      updateDisplay();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
      else if (e.key === '.') appendNumber('.');
      else if (['+', '-', '*', '/'].includes(e.key)) chooseOperator(e.key);
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Backspace') deleteLast();
      else if (e.key === 'Escape') clearAll();
    });
  </script>
</body>
</html>
